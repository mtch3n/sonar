name: Release

# A tag like v0.1.0 publishes that version. Every night, and whenever it's run by
# hand, main is built as a nightly: a prerelease under the `nightly` tag, versioned
# like 0.4.2-nightly.20260928 after 0.4.1, which never becomes the latest release that
# installed copies update to. Run by hand on another branch, it's a trial: everything
# is built the same way and kept as the run's artifacts, and nothing is released.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      nightly: ${{ steps.version.outputs.nightly }}
      trial: ${{ steps.version.outputs.trial }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" != main ]; then
            # Run by hand on another branch: a trial build, kept as the run's
            # artifacts and never released.
            IFS=. read -r major minor patch <<< "$version"
            version="$major.$minor.$((patch + 1))-trial.$(date -u +%Y%m%d)"
            echo "trial=true" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$built" = "$GITHUB_SHA" ]; then
              echo "main hasn't changed since the last nightly"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            # A nightly leads up to the next patch release, so it sorts above the last one.
            IFS=. read -r major minor patch <<< "$version"
            version="$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d)"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create a draft release
        id: create
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.trial != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.version.outputs.nightly }}
        run: |
          if [ "$NIGHTLY" = true ]; then
            # One nightly at a time: the last one makes way.
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            tag=nightly
            name="Sonar nightly $VERSION"
            printf 'A nightly build of main at %s. It may be broken; installed copies of Sonar never update to it.\n' "$GITHUB_SHA" > notes.md
            prerelease=true
          else
            tag="$GITHUB_REF_NAME"
            name="Sonar $VERSION"
            awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "CHANGELOG.md has no section for $VERSION"
              exit 1
            fi
            prerelease=false
            case "$VERSION" in *-*) prerelease=true ;; esac
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$name" \
            -F body=@notes.md \
            -F draft=true \
            -F prerelease="$prerelease" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: draft
    if: needs.draft.outputs.id || needs.draft.outputs.trial == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the nightly version
        if: needs.draft.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          # The first version in each file is the app's own.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/"version": "[^"]*"/"version": "$ENV{VERSION}"/' app/package.json
          cargo update --workspace

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Use a linuxdeploy that can leave libraries out
        if: runner.os == 'Linux'
        run: |
          tool="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          mkdir -p "$(dirname "$tool")"
          curl -fsSL -o "$tool" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tool" | sha256sum -c -
          chmod +x "$tool"
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: |
          cargo --version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libwayland-*
        with:
          projectPath: app
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}
      - name: Keep a trial build's installers
        if: needs.draft.outputs.trial == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-app-${{ runner.os }}
          path: |
            target/release/bundle/*/*
            target/universal-apple-darwin/release/bundle/*/*
          if-no-files-found: error

  cli:
    needs: draft
    if: needs.draft.outputs.id || needs.draft.outputs.trial == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the nightly version
        if: needs.draft.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          # The first version in each file is the app's own.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/"version": "[^"]*"/"version": "$ENV{VERSION}"/' app/package.json
          cargo update --workspace
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir out
          if [ "$TARGET" = universal-apple-darwin ]; then
            cargo --version
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked -p sonar-cli --target aarch64-apple-darwin
            cargo build --release --locked -p sonar-cli --target x86_64-apple-darwin
            lipo -create -output out/sonar \
              target/aarch64-apple-darwin/release/sonar \
              target/x86_64-apple-darwin/release/sonar
          else
            cargo build --release --locked -p sonar-cli
            cp target/release/sonar* out/
            rm -f out/*.d out/*.pdb
          fi
          cp LICENSE README.md out/
      - name: Keep a trial build's program
        if: needs.draft.outputs.trial == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-cli-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
      - name: Upload
        if: needs.draft.outputs.id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          name="sonar-cli-$VERSION-$TARGET"
          cd out
          if [ "$RUNNER_OS" = Windows ]; then
            asset="$name.zip"
            7z a "../$asset" *
          else
            asset="$name.tar.gz"
            tar -czf "../$asset" *
          fi
          cd ..
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset" \
            --input "$asset" > /dev/null

  publish:
    needs: [draft, app, cli]
    if: needs.draft.outputs.id
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Add checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          NIGHTLY: ${{ needs.draft.outputs.nightly }}
        run: |
          mkdir assets && cd assets
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset_id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$name"
            done
          sha256sum -- * > SHA256SUMS.txt
          gh api --method POST \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt > /dev/null
          # A nightly is never the latest release, which installed copies update from.
          latest=true
          [ "$NIGHTLY" = true ] && latest=false
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest="$latest" > /dev/null
