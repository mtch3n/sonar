[package]
name = "sonar-plugins"
description = "Sonar's plugins: the external plugin protocol and the built-in calculator with exchange rates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64.workspace = true
dirs.workspace = true
fend-core.workspace = true
flate2.workspace = true
iso_country.workspace = true
iso_currency.workspace = true
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sonar-apps.workspace = true
sys-locale.workspace = true
sysinfo.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }
toml.workspace = true
ureq.workspace = true

[target."cfg(target_os = \"linux\")".dependencies]
zbus.workspace = true

[target."cfg(windows)".dependencies]
windows-registry.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
