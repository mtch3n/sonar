[workspace]
resolver = "3"
members = ["crates/core", "crates/plugins", "crates/apps", "crates/settings", "crates/models", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.97"
publish = false
authors = ["mtch3n <mingtse.chen03@gmail.com>"]
license = "MIT"
repository = "https://github.com/mtch3n/sonar"
homepage = "https://github.com/mtch3n/sonar"

[workspace.dependencies]
sonar-core = { path = "crates/core" }
sonar-apps = { path = "crates/apps" }
sonar-plugins = { path = "crates/plugins" }
sonar-settings = { path = "crates/settings" }
sonar-models = { path = "crates/models" }
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
calamine = "0.36.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fend-core = "1.5.8"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
flate2 = "1.1.10"
ignore = "0.4.33"
hickory-resolver = "0.26.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
listeners = "0.6.1"
memmap2 = "0.9.11"
iso_country = "0.1.4"
iso_currency = { version = "0.7.1", features = ["iterator"] }
jiff = "0.2.37"
keyring = "4.2.0"
notify = "8.2.0"
pdf-extract = "0.12.1"
quick-xml = "0.41.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
self_update = { version = "1.3.0", default-features = false, features = ["github", "ureq", "rustls", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "checksums", "progress-bar"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
tar = "0.4.46"
xattr = "1.6.1"
tauri-build = "2.6.3"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tempfile = "3.27.0"
tokio = "1.53.1"
toml = "1.1.6"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml_edit = "0.25.15"
webkit2gtk = "2.0.2"
gtk = "0.18.2"
gdkx11 = "0.18.2"
zbus = "5.19.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
x11rb = { version = "0.13.2", features = ["xfixes"] }
windows-registry = "0.100.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
