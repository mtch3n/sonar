[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
authors = ["mtch3n <mingtse.chen03@gmail.com>"]
license = "MIT"
repository = "https://github.com/mtch3n/sonar"
homepage = "https://github.com/mtch3n/sonar"

[workspace.dependencies]
sonar-core = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ignore = "0.4.33"
jiff = "0.2.37"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = "2.6.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
